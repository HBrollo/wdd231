<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Helaman Brollo">
    <meta name="description" content="A form with input options required for becoming a Mukli reseller.">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <link rel="icon" href="images/favicon.ico">
    <script src="scripts/form.js" defer></script>
    <title>Mukli Alfajores</title>
</head>
<body>
    <header>
        <div class="title">
            <img loading="lazy" src="images/sun.webp">
            <h1>Mukli Alfajores</h1>
        </div>
        <div id="menu">
            <!--Hamburger button goes here-->
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="menu.html">Menu</a>
            <a href="form.html">Join</a>
        </nav>
    </header>
    <main>
        <picture class="hero">
            <source srcset="images/hero.webp" media="(min-width: 750px)">
            <img loading="lazy" src="images/hero-small.webp" alt="Mukli Alfajores">
        </picture>
        <section class="wave">
            <!--Fancy wave here-->
        </section>
        <div class="form">
            <h2 id="intro">What to be a reseller? Just fill out the form, and we'll contact you.</h2>
            <form action="" method="get">
                <label for="firstName">First Name:</label>
                <input type="text" name="firstName" id="firstName" title="firstName" placeholder="John" required>

                <label for="lastName">Last Name:</label>
                <input type="text" name="lastName" id="lastName" title="lastName" placeholder="Doe" required>

                <label for="organizationTitle">Organization Title:</label>
                <input type="text" name="title" id="organizationTitle" autocomplete="organization-title" placeholder="e.g. Senior Project-Manager" minlength="7" pattern="^[A-Za-z\- ]{7,}$" title="Use only letters, hyphens, and spaces (minimum 7 characters)" required>
            
                <label for="email">Email Address:</label>
                <input type="email" name="email" id="email" autocomplete="email" placeholder="JohnDoe@gmail.com" required> 
            
                <label for="phone">Telephone Number:</label>
                <input type="tel" name="phone" id="phone" title="Phone Number" autocomplete="tel" placeholder="+(55)5555-5555" required> 

                <label for="organization">Organization's Name:</label>
                <input type="text" name="organization" id="organization" title="The organization's name" autocomplete="organization" required>  

                <label for="description">Organization's description:</label>
                <textarea name="description" id="description"></textarea>

                <input type="hidden" id="timestamp" name="timestamp">

                <label for="submit">Submit Form:</label>
                <input type="submit" id="submit" value="Send"> 
            </form>
        </div>
        <dialog>
            <h2>Thank you for your submission!</h2>
            <p>We will contact you as soon as possible.</p>
            <a href="index.html" id="close">Back to Home page</a>
        </dialog>
    </main>
    <footer>
        <p>
            ©<span id="currentyear"></span> Helaman Brollo, Brazil
        </p>
        <p>
            Last Modified: <span id="lastModified"></span>
        </p>
    </footer>
</body>
</html>
