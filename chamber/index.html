<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Helaman Brollo">
    <meta name="description" content="A page dedicated to the Nova Petrópolis chamber of commerce.">
    <meta property="og:title" content="Nova Petrópolis Chamber of Commerce">
    <meta property="og:description" content="A page dedicated to the Nova Petrópolis chamber of commerce.">
    <meta property="og:image" content="https://hbrollo.github.io/wdd231/chamber/images/hero.png">
    <meta property="og:url" content="https://hbrollo.github.io/wdd231/chamber/directory.html">
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/index-large.css">
    <script src="scripts/index.js" defer></script>
    <title>Nova Petropolis Chamber of Commerce</title>
</head>
<body>
    <header>
        <div class="title">
            <img src="images/flower.png" alt="flower">
            <h2>Nova Petrópolis Chamber of Commerce</h2>
            <div id="menu">
                <!--Hamburger button goes here-->
            </div>
        </div>
        <nav>
            <a>Home</a>
            <a>Directory</a>
            <a>Join</a>
            <a>Discover</a>
        </nav>
    </header>
    <main>
        <picture class="hero">
            <source srcset="images/hero.png" media="(min-width: 750px)">
            <img src="images/hero_mobile.jpg" alt="Nova Petropolis">
        </picture>
        <h2>Home</h2>
        <div class="action">
            <h2>Join us!</h2>
        </div>
        <div class="events">
            <h2>Events:</h2>
            <h3>Nothing right now.</h3>
            <h3>Check back later! :D</h3>

        </div>
        <div class="weather">
            <!--Weather content goes here-->
            <h2>Current weather:</h2>
            <div class="display">
                <h2 id="temperature" ></h2>
                <img id="icon" >
            </div>
            <h2 id="description"></h2>
        </div>
        <div class="center">
            <h2>Featured businesses:</h2>
        </div>    
        <ul class="business grid">
            <!--Cards go here-->
        </ul>
    </main>
    <footer>
        <p>
            ©<span id="currentyear"></span> Helaman Brollo, Brazil
        </p>
        <p>
            Last Modified: <span id="lastModified"></span>
        </p>
    </footer>
</body>
</html>
